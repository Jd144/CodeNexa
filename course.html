<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeNexa LMS Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- LMS HEADER BAR -->
    <header class="bg-slate-900 text-white px-6 py-3 flex justify-between items-center z-20 shadow-md">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="h-4 w-px bg-slate-700"></div>
            <span class="font-bold text-lg text-emerald-400">CodeNexa <span class="text-xs bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-800">Institute LMS</span></span>
        </div>

        <div class="flex items-center space-x-6">
            <div class="hidden sm:flex items-center gap-3">
                <span class="text-xs font-mono text-slate-400" id="progress-text">Progress: 0%</span>
                <div class="w-28 bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700">
                    <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
                </div>
            </div>

            <select id="langSelector" onchange="changeLanguage(this.value)" class="bg-slate-800 text-white text-xs border border-slate-700 rounded-lg px-2.5 py-1.5 focus:outline-none cursor-pointer">
                <option value="hinglish">Hinglish</option>
                <option value="hindi">हिंदी (Hindi)</option>
                <option value="english">English</option>
            </select>
        </div>
    </header>

    <!-- LMS MAIN LAYOUT -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside class="w-80 bg-white border-r border-slate-200 overflow-y-auto flex flex-col">
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Course Syllabus</span>
            </div>
            <div id="module-list" class="flex-1 p-3 space-y-1"></div>
        </aside>

        <!-- CENTER CONTENT: INSTITUTE TABS -->
        <main class="flex-1 overflow-y-auto bg-slate-50 flex flex-col">
            
            <div class="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center shadow-sm">
                <div>
                    <span id="lesson-category" class="text-xs font-bold uppercase text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded border border-emerald-200">Module 0</span>
                    <h1 id="lesson-title" class="text-2xl font-black text-slate-900 mt-2">Loading...</h1>
                </div>

                <button onclick="toggleComplete()" id="complete-btn" class="px-4 py-2 text-sm font-semibold rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 transition flex items-center gap-2">
                    <i class="fa-regular fa-circle"></i> Mark Complete
                </button>
            </div>

            <!-- TABS -->
            <div class="bg-white px-8 border-b border-slate-200 flex space-x-6">
                <button onclick="switchTab('theory')" id="tab-btn-theory" class="py-3 text-sm font-bold border-b-2 border-emerald-600 text-emerald-700 flex items-center gap-2">
                    <i class="fa-solid fa-book-open"></i> 1. Concept & Theory
                </button>
                <button onclick="switchTab('lab')" id="tab-btn-lab" class="py-3 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-terminal"></i> 2. Code & Terminal Lab
                </button>
                <button onclick="switchTab('quiz')" id="tab-btn-quiz" class="py-3 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-circle-question"></i> 3. Knowledge Test
                </button>
            </div>

            <!-- TAB CONTENT -->
            <div class="p-8 max-w-4xl w-full mx-auto flex-1">
                
                <div id="tab-theory" class="tab-panel bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <div id="lesson-content" class="text-slate-700 text-lg leading-relaxed space-y-4"></div>
                </div>

                <div id="tab-lab" class="tab-panel hidden space-y-6">
                    <div class="bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-xl">
                        <div class="bg-slate-800 px-4 py-2 text-xs flex justify-between items-center text-slate-400 font-mono">
                            <span class="text-emerald-400"><i class="fa-solid fa-code mr-1"></i> Interactive Editor</span>
                            <button onclick="copyCode()"><i class="fa-regular fa-copy"></i> Copy</button>
                        </div>
                        <pre class="p-5 text-sky-400 font-mono text-sm overflow-x-auto bg-slate-950"><code id="code-content">Loading...</code></pre>
                    </div>

                    <div class="p-5 bg-slate-950 rounded-2xl border border-slate-800 font-mono text-sm">
                        <div class="text-xs text-slate-500 pb-2 mb-2 border-b border-slate-800">Terminal Output</div>
                        <div id="terminal-output" class="text-emerald-400">> Output will show here...</div>
                    </div>
                </div>

                <div id="tab-quiz" class="tab-panel hidden bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                    <h3 class="text-xl font-bold text-slate-900">Module Assessment</h3>
                    <p id="quiz-question" class="text-base font-semibold text-slate-800">Q: Question loading...</p>
                    <div id="quiz-options" class="grid grid-cols-1 gap-3"></div>
                    <div id="quiz-feedback" class="text-sm font-bold hidden p-3 rounded-xl"></div>
                </div>

                <!-- NAVIGATION -->
                <div class="flex justify-between items-center pt-8 border-t border-slate-200">
                    <button id="prev-btn" onclick="navigateLesson(-1)" class="px-5 py-2.5 bg-white border border-slate-300 rounded-xl text-slate-700 font-semibold">
                        <i class="fa-solid fa-arrow-left mr-2"></i> Previous
                    </button>
                    <button id="next-btn" onclick="navigateLesson(1)" class="px-6 py-2.5 bg-emerald-700 text-white font-bold rounded-xl shadow">
                        Next Lesson <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>

            </div>
        </main>
    </div>

    <script src="js/content.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
